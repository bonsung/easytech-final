document.addEventListener('paste',(e)=>{
  const appActive=document.getElementById('appScreen')?.classList.contains('active');
  if(!appActive) return;
  const modalOpen=!!document.getElementById('taskModalOverlay');
  const items=e.clipboardData?.items;
  if(!items) return;
  let hasImage=false;
  for(const item of items){
    if(item.type.startsWith('image/')){
      const file=item.getAsFile();
      if(file&&modalOpen){
        processFilesTo([file],modalAttachments,renderModalAttachments);
        hasImage=true;
      }
    }
  }
  if(hasImage) showToast('📎 이미지가 첨부되었습니다','success');
});

function renderCardButtons(log, task){
  if(!log || log.member_name !== currentMember) return '';
  const taskId = task ? (task.task_id || '') : '';
  return `
    <div style="display:flex;gap:8px;margin-top:0;">
      <button onclick="handleCardEdit('${log.id}','${taskId}')"
        style="padding:6px 14px;background:white;border:1.5px solid #ddd;
        border-radius:8px;font-size:0.82em;font-weight:600;cursor:pointer;color:#333;">
        修改
      </button>
      <button onclick="confirmDeleteLog('${log.id}')"
        style="padding:6px 14px;background:var(--red);border:none;
        border-radius:8px;font-size:0.82em;font-weight:600;cursor:pointer;color:white;">
        删除
      </button>
    </div>`;
}

function handleCardEdit(logId, taskId){
  const log = allLogs.find(l => l.id === logId);
  if(!log || log.member_name !== currentMember){
    showToast('본인 기록만 수정 가능합니다','error'); return;
  }

  const task = taskId ? (log.tasks||[]).find(t => t.task_id === taskId) : null;
  const targetId = taskId || log.id;
  const targetContent = task ? (task.content||'') : (log.meetings||'');
  const targetTitle = task ? (task.title||'') : '';

  const cardEl = document.querySelector(`[data-task-id="${targetId}"]`);
  if(!cardEl){
    currentDate = log.log_date;
    const d = new Date(log.log_date+'T00:00:00');
    calYear=d.getFullYear(); calMonth=d.getMonth();
    renderCalendar(); renderMain();
    return;
  }

  cardEl.innerHTML = `
    <div style="padding:4px 0 10px;font-weight:700;font-size:1em;">${escapeHtml(targetTitle)}</div>
    <div class="quill-wrap" id="edit-quill-wrap-${targetId}">
      <div id="edit-quill-${targetId}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button onclick="saveCardEdit('${logId}','${taskId}')"
        style="padding:7px 18px;background:var(--teal);color:white;border:none;
        border-radius:8px;font-weight:700;cursor:pointer;">保存</button>
      <button onclick="renderMain()"
        style="padding:7px 18px;background:white;color:var(--ink);border:1.5px solid #ddd;
        border-radius:8px;font-weight:600;cursor:pointer;">取消</button>
    </div>`;

  const q = new Quill(`#edit-quill-${targetId}`, {
    theme:'snow',
    modules:{toolbar:false}
  });
  q.root.innerHTML = targetContent;
  window._editQuill = q;
}

async function saveCardEdit(logId, taskId){
  const newContent = window._editQuill ? window._editQuill.root.innerHTML : '';
  const log = allLogs.find(l => l.id === logId);
  if(!log) return;
  showLoading('保存中...');

  try {
    let updatedTasks = log.tasks || [];
    const taskIdx = updatedTasks.findIndex(t => t.task_id === taskId);
    if(taskIdx >= 0){
      updatedTasks[taskIdx] = {...updatedTasks[taskIdx], content: newContent};
      await saveLogData(log.member_name, log.log_date, {tasks: updatedTasks});
    } else {
      await saveLogData(log.member_name, log.log_date, {meetings: newContent});
    }
    await loadAllLogs();
    showToast('✅ 修改成功','success');
    renderMain();
  } catch(e){
    console.error('[saveCardEdit]', e);
    showToast('저장 중 오류가 발생했습니다','error');
  } finally {
    hideLoading();
  }
}

async function loadNotices() {
  if (demoMode) {
    allNotices = JSON.parse(localStorage.getItem(NOTICES_KEY) || '[]');
    renderNoticesSidebar();
    return;
  }
  try {
    const r = await sbFetch('notices?select=*&order=created_at.desc');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    allNotices = await r.json();
    renderNoticesSidebar();
  } catch(e) {
    console.warn('[loadNotices] notices 로딩 실패 — 로컬 모드 전환:', e.message);
    allNotices = JSON.parse(localStorage.getItem(NOTICES_KEY) || '[]');
    renderNoticesSidebar();
  }
}

function getNoticeUnreadCount() {
  if (!currentMember) return 0;
  return allNotices.filter(n => {
    const rb = Array.isArray(n.read_by) ? n.read_by : [];
    return !rb.includes(currentMember);
  }).length;
}

function renderNoticesSidebar() {
  const badge = document.getElementById('noticeBadge');
  const list  = document.getElementById('noticeList');
  if (!badge || !list) return;

  const unread = getNoticeUnreadCount();
  if (unread > 0) {
    badge.textContent = unread;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }

  const recent = allNotices.slice(0, 3);
  if (!recent.length) {
    list.innerHTML = '<div style="font-size:0.77em;color:rgba(255,255,255,0.33);padding:4px 4px 6px;">暂无公告</div>';
    return;
  }
  list.innerHTML = recent.map(n => {
    const rb = Array.isArray(n.read_by) ? n.read_by : [];
    const isUnread = !rb.includes(currentMember);
    const dateStr = n.created_at
      ? new Date(n.created_at).toLocaleDateString('ko-KR', {month:'short', day:'numeric'})
      : '';
    return `<div class="notice-item" onclick="openNoticeDetail('${n.id}')">
      <div class="notice-dot${isUnread ? ' unread' : ''}"></div>
      <div class="notice-item-info">
        <div class="notice-item-title">${escapeHtml(n.title)}</div>
        <div class="notice-item-date">${dateStr}</div>
      </div>
    </div>`;
  }).join('');
}

function openNoticeWrite() {
  document.getElementById('noticeTitleInput').value = '';
  document.getElementById('noticeBodyInput').value  = '';
  document.getElementById('noticeWriteOverlay').classList.add('show');
  setTimeout(() => document.getElementById('noticeTitleInput')?.focus(), 50);
}

function closeNoticeWrite() {
  document.getElementById('noticeWriteOverlay').classList.remove('show');
}

async function submitNotice() {
  const title   = (document.getElementById('noticeTitleInput')?.value || '').trim();
  const content = (document.getElementById('noticeBodyInput')?.value  || '').trim();
  if (!title) { showToast('请输入标题', 'error'); return; }

  const now = new Date().toISOString();
  const notice = {
    id: genUUID(), title, content, author: currentMember,
    created_at: now, updated_at: now, comments: [], read_by: [currentMember]
  };

  showLoading('保存中...');

  if (demoMode) {
    allNotices.unshift(notice);
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
    hideLoading(); closeNoticeWrite(); renderNoticesSidebar();
    showToast('📢 公告已发布', 'success');
    return;
  }

  try {
    const r = await sbFetch('notices', {method:'POST', prefer:'return=minimal', body:JSON.stringify(notice)});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    await loadNotices();
  } catch(e) {
    console.warn('[submitNotice]', e.message);
    allNotices.unshift(notice);
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
    renderNoticesSidebar();
  }
  hideLoading(); closeNoticeWrite();
  showToast('📢 公告已发布', 'success');
}

async function openNoticeDetail(noticeId) {
  currentNoticeId = noticeId;
  const notice = allNotices.find(n => n.id === noticeId);
  if (!notice) return;

  const rb = Array.isArray(notice.read_by) ? [...notice.read_by] : [];
  if (!rb.includes(currentMember)) {
    rb.push(currentMember);
    notice.read_by = rb;
    await _persistNoticeReadBy(notice);
    renderNoticesSidebar();
  }

  renderNoticeDetailModal();
  const overlay = document.getElementById('noticeDetailOverlay');
  overlay.classList.add('show');
}

async function _persistNoticeReadBy(notice) {
  if (demoMode) {
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices)); return;
  }
  try {
    await sbFetch(`notices?id=eq.${notice.id}`, {
      method:'PATCH', prefer:'return=minimal',
      body: JSON.stringify({read_by: notice.read_by})
    });
  } catch(e) {
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
  }
}

        <input type="text" class="comment-input" id="nci-${notice.id}"
          placeholder="댓글을 입력하세요..."
          onkeydown="if(event.key==='Enter')saveNoticeComment('${notice.id}')">
        <button class="btn btn-save btn-sm" onclick="saveNoticeComment('${notice.id}')">提交</button>
      </div>
    </div>`;
}

function closeNoticeDetail() {
  document.getElementById('noticeDetailOverlay').classList.remove('show');
}

async function saveNoticeEdit(noticeId) {
  const title   = (document.getElementById('noticeEditTitle')?.value || '').trim();
  const content = (document.getElementById('noticeEditBody')?.value  || '').trim();
  if (!title) { showToast('请输入标题', 'error'); return; }

  const idx = allNotices.findIndex(n => n.id === noticeId);
  if (idx < 0) return;
  const updated_at = new Date().toISOString();
  allNotices[idx] = { ...allNotices[idx], title, content, updated_at };

  showLoading('修改中...');

  if (demoMode) {
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
    hideLoading(); renderNoticesSidebar(); renderNoticeDetailModal();
    showToast('✅ 修改成功', 'success');
    return;
  }

  try {
    await sbFetch(`notices?id=eq.${noticeId}`, {
      method:'PATCH', prefer:'return=minimal',
      body: JSON.stringify({title, content, updated_at})
    });
    await loadNotices();
  } catch(e) {
    console.warn('[saveNoticeEdit]', e.message);
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
    renderNoticesSidebar();
  }
  hideLoading(); renderNoticeDetailModal();
  showToast('✅ 수정되었습니다', 'success');
}

async function deleteNotice(noticeId) {
  showConfirm('确认删除', '确定要删除此公告吗？', async () => {
    showLoading('删除中...');
    allNotices = allNotices.filter(n => n.id !== noticeId);

    if (demoMode) {
      localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
      hideLoading(); closeNoticeDetail(); renderNoticesSidebar();
      showToast('🗑️ 삭제되었습니다', 'success');
      return;
    }

    try {
      await sbFetch(`notices?id=eq.${noticeId}`, {method:'DELETE'});
    } catch(e) {
      console.warn('[deleteNotice]', e.message);
      localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
    }
    hideLoading(); closeNoticeDetail(); renderNoticesSidebar();
    showToast('🗑️ 삭제되었습니다', 'success');
  });
}

async function saveNoticeComment(noticeId) {
  const input = document.getElementById('nci-' + noticeId);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  const notice = allNotices.find(n => n.id === noticeId);
  if (!notice) return;

  const comment = {
    id: genUUID(), author: currentMember, text,
    created_at: new Date().toISOString()
  };
  notice.comments = [...(Array.isArray(notice.comments) ? notice.comments : []), comment];
  input.value = '';

  if (demoMode) {
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
    renderNoticeDetailModal(); return;
  }

  try {
    await sbFetch(`notices?id=eq.${noticeId}`, {
      method:'PATCH', prefer:'return=minimal',
      body: JSON.stringify({comments: notice.comments})
    });
  } catch(e) {
    console.warn('[saveNoticeComment]', e.message);
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
  }
  renderNoticeDetailModal();
}

async function deleteNoticeComment(noticeId, commentId) {
  const notice = allNotices.find(n => n.id === noticeId);
  if (!notice) return;

  notice.comments = (Array.isArray(notice.comments) ? notice.comments : [])
    .filter(c => c.id !== commentId);

  if (demoMode) {
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
    renderNoticeDetailModal(); return;
  }

  try {
    await sbFetch(`notices?id=eq.${noticeId}`, {
      method:'PATCH', prefer:'return=minimal',
      body: JSON.stringify({comments: notice.comments})
    });
  } catch(e) {
    console.warn('[deleteNoticeComment]', e.message);
    localStorage.setItem(NOTICES_KEY, JSON.stringify(allNotices));
  }
  renderNoticeDetailModal();
}

// 공지 모달 오버레이 클릭으로 닫기
document.addEventListener('click', e => {
  if (e.target.id === 'noticeWriteOverlay')  closeNoticeWrite();
  if (e.target.id === 'noticeDetailOverlay') closeNoticeDetail();
});

// 앱 진입 시 히스토리 스택 고정 + 저장 세션 자동 복원
window.addEventListener('load', () => {
  history.replaceState({screen:'app'}, '', '');
  sbUrl = CONFIG.SUPABASE_URL; sbKey = CONFIG.SUPABASE_KEY; emailDomain = CONFIG.EMAIL_DOMAIN;
  const savedSession = localStorage.getItem('auth_session');
  if(savedSession){
    try {
      authSession = JSON.parse(savedSession);
      showLoading('연결 중...');
      fetch(`${sbUrl}/auth/v1/user`, {
        headers:{'apikey':sbKey,'Authorization':`Bearer ${authSession.access_token}`}
      }).then(async r => {
        if(r.ok){
          authSession.user = await r.json();
          localStorage.setItem('auth_session', JSON.stringify(authSession));
          await afterAuth();
        } else {
          localStorage.removeItem('auth_session');
          hideLoading();
          showScreen('loginScreen');
        }
      }).catch(()=>{ hideLoading(); showScreen('loginScreen'); });
      return;
    } catch(e){ localStorage.removeItem('auth_session'); }
  }
  showScreen('loginScreen');
});

window.addEventListener('popstate', (e) => {
  // 항상 현재 화면 유지 — 외부로 나가지 않음
  history.pushState({screen:'app'}, '', '');

  // 보고서 화면이면 메인으로
  if(document.getElementById('reportScreen').classList.contains('active')){
    showScreen('appScreen');
  }
});
</script>
