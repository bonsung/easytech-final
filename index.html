<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easytech TeamWork</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
<style>
/* Quill 상위 번호 변경 시 하위 알파벳 카운터 리셋 */
.ql-editor ol {
  counter-reset: list-0;
}
.ql-editor ol > li:not([class*="ql-indent"]) {
  counter-reset: list-1 list-2 list-3;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --teal:#1f5fae; --teal-dark:#123b7a; --teal-light:#2f83de;
  --cream:#fbfcff; --warm:#eef3fb; --ink:#151a22; --muted:#6b7789;
  --border:#e4ddd0; --red:#d4001a; --gold:#d4001a;
  --blue:#1f5fae; --radius:14px; --shadow:0 2px 16px rgba(31,95,174,0.12);
  --green:#2e9e6b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-wrap:break-word;word-break:break-word;}
.screen{display:none;} .screen.active{display:flex;}

/* ── PIN SCREEN ── */
#pinScreen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--teal-dark),var(--teal) 60%,var(--teal-light));padding:24px;}
.pin-card{background:white;border-radius:24px;padding:48px 40px;width:100%;max-width:400px;
  box-shadow:0 24px 80px rgba(0,0,0,0.3);text-align:center;}
.pin-logo{font-size:3em;margin-bottom:12px;}
.pin-title{font-family:'Playfair Display',serif;font-size:1.6em;color:var(--teal);margin-bottom:6px;}
.pin-sub{color:var(--muted);font-size:0.88em;margin-bottom:28px;}
.pin-label{font-size:0.78em;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);display:block;text-align:left;margin-bottom:8px;}
.pin-input{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;
  font-size:1.1em;outline:none;transition:border-color 0.2s;font-family:'Plus Jakarta Sans',sans-serif;}
.pin-input:focus{border-color:var(--teal);}
.pin-login-btn{width:100%;padding:14px;background:var(--teal);color:white;border:none;
  border-radius:10px;font-size:1em;font-weight:700;cursor:pointer;margin-top:10px;
  font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.2s;}
.pin-login-btn:hover{background:var(--teal-dark);}
.pin-error{color:var(--red);font-size:0.82em;margin-top:14px;display:none;}
/* PIN pad */
.pin-dots{display:flex;gap:16px;justify-content:center;margin:20px 0 28px;}
.pin-dot{width:18px;height:18px;border-radius:50%;background:#e0e0e0;transition:background 0.15s;}
.pin-dot.filled{background:var(--teal);}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.pin-num{padding:18px;background:#f5f6fa;border:none;border-radius:12px;font-size:1.3em;
  font-weight:600;cursor:pointer;transition:all 0.15s;font-family:'Plus Jakarta Sans',sans-serif;}
.pin-num:hover{background:#e8ecf4;}
.pin-num:active{transform:scale(0.94);background:#d0d8ec;}
.pin-back,.pin-clear{font-size:1em;color:var(--muted);}
/* Badge dropdown */
.badge-wrap{position:relative;}
.badge-dropdown{position:absolute;top:calc(100% + 8px);left:0;background:white;border-radius:12px;
  box-shadow:0 8px 32px rgba(0,0,0,0.18);z-index:200;min-width:180px;overflow:hidden;}
.badge-dropdown button{display:block;width:100%;padding:10px 18px;background:none;border:none;
  text-align:left;font-size:0.9em;font-weight:600;cursor:pointer;color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;}
.badge-dropdown button:hover{background:var(--warm);}
.badge-dd-label{padding:10px 18px 4px;font-size:0.72em;font-weight:700;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;}
.badge-dd-divider{height:1px;background:var(--border);margin:4px 0;}
.badge-dd-active{background:var(--warm)!important;}

/* ── MEMBER SCREEN ── */
#memberScreen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--teal-dark),var(--teal) 60%,var(--teal-light));padding:24px;}
.member-title{font-family:'Playfair Display',serif;font-size:2.2em;color:white;text-align:center;margin-bottom:8px;}
.member-subtitle{color:rgba(255,255,255,0.7);text-align:center;margin-bottom:40px;}
.member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:480px;width:100%;}
.member-card{background:white;border-radius:20px;padding:32px 20px;text-align:center;cursor:pointer;
  transition:all 0.25s;box-shadow:0 8px 32px rgba(0,0,0,0.15);}
.member-card:hover{transform:translateY(-6px);box-shadow:0 20px 48px rgba(0,0,0,0.2);}
.member-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.4em;font-weight:700;color:white;margin:0 auto 12px;}
.member-name{font-family:'Playfair Display',serif;font-size:1.3em;color:var(--ink);}
.avatar-jp{background:linear-gradient(135deg,#e05252,#c93939);}
.avatar-beryl{background:linear-gradient(135deg,#3b6ea8,#2755a0);}
.avatar-bq{background:linear-gradient(135deg,#c9973a,#b07d20);}
.avatar-gao{background:linear-gradient(135deg,#2e9e6b,#1a7a52);}

/* ── APP ── */
#appScreen{flex-direction:column;min-height:100vh;}
.topbar{background:var(--teal-dark);padding:0 24px;height:56px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.2);}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-logo{font-family:'Playfair Display',serif;color:white;font-size:1.15em;}
.member-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);
  border-radius:30px;padding:5px 14px 5px 5px;cursor:pointer;}
.badge-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:0.72em;font-weight:700;color:white;}
.badge-name{color:white;font-size:0.88em;font-weight:600;}
.topbar-right{display:flex;gap:8px;align-items:center;}
.icon-btn{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:20px;
  text-decoration:none;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.78em;font-weight:600;transition:all 0.2s;}
.icon-btn:hover{transform:scale(1.05);}
.btn-wechat{background:#07C160;color:white;}
.btn-email{background:rgba(255,255,255,0.15);color:white;}
.btn-reports-nav{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.9);}

/* ── LAYOUT ── */
.app-layout{display:grid;grid-template-columns:280px 1fr;flex:1;min-height:calc(100vh - 56px);}
.sidebar{background:var(--teal);padding:18px 12px;overflow-y:auto;}
.main-area{background:var(--cream);padding:24px 28px;overflow-y:auto;}

/* ── CALENDAR ── */
.calendar{margin-bottom:16px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-month{font-family:'Playfair Display',serif;color:white;font-size:0.92em;}
.cal-nav{background:rgba(255,255,255,0.12);border:none;color:white;width:26px;height:26px;
  border-radius:7px;cursor:pointer;font-size:0.9em;display:flex;align-items:center;justify-content:center;transition:background 0.15s;}
.cal-nav:hover{background:rgba(255,255,255,0.25);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dow{text-align:center;font-size:0.6em;font-weight:700;color:rgba(255,255,255,0.45);padding:4px 0;}
.cal-cell{text-align:center;font-size:0.74em;padding:5px 2px;border-radius:6px;cursor:pointer;
  color:rgba(255,255,255,0.65);transition:all 0.12s;position:relative;min-height:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}
.cal-cell:hover:not(.empty){background:rgba(255,255,255,0.15);color:white;}
.cal-cell.today{color:var(--gold);font-weight:700;background:rgba(201,151,58,0.2);}
.cal-cell.selected{background:white!important;color:var(--teal-dark)!important;font-weight:700;}
.cal-cell.has-log::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--gold);position:absolute;bottom:2px;}
.cal-cell.selected.has-log::after{background:var(--teal);}

/* ── SIDEBAR SECTIONS ── */
.sidebar-label{font-size:0.63em;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,0.4);margin-bottom:7px;padding-left:4px;}
.sidebar-section{margin-top:14px;}
.search-wrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);
  border-radius:10px;padding:8px 11px;margin-bottom:10px;}
.search-wrap input{background:none;border:none;outline:none;color:white;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:0.84em;width:100%;}
.search-wrap input::placeholder{color:rgba(255,255,255,0.38);}
.search-results{display:flex;flex-direction:column;gap:5px;max-height:250px;overflow-y:auto;}
.sri{background:rgba(255,255,255,0.08);border-radius:8px;padding:8px 10px;cursor:pointer;transition:all 0.12s;}
.sri:hover{background:rgba(255,255,255,0.15);}
.sri-date{font-size:0.68em;color:rgba(255,255,255,0.45);}
.sri-member{font-size:0.74em;font-weight:600;color:var(--gold);}
.sri-preview{font-size:0.77em;color:rgba(255,255,255,0.75);margin-top:2px;}
mark{background:rgba(201,151,58,0.4);color:white;border-radius:2px;padding:0 1px;}
.team-list{display:flex;flex-direction:column;gap:3px;}
.team-item{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:9px;
  color:rgba(255,255,255,0.72);font-size:0.84em;transition:all 0.12s;}
.team-item:hover{background:rgba(255,255,255,0.1);color:white;}
.team-item.active{background:rgba(255,255,255,0.18);color:white;font-weight:600;}
.team-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── MAIN HEADER ── */
.date-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.date-title{font-family:'Playfair Display',serif;font-size:1.8em;color:var(--ink);}
.date-sub{color:var(--muted);font-size:0.86em;margin-top:3px;}
.viewing-badge{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:0.82em;font-weight:600;color:white;}
.stats-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.stat-pill{background:white;border-radius:10px;padding:9px 15px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);font-size:0.8em;}
.stat-pill .num{font-family:'Playfair Display',serif;font-size:1.35em;color:var(--teal);}
.stat-pill .lbl{color:var(--muted);}

/* ── TABS ── */
.tabs{display:flex;gap:3px;margin-bottom:18px;border-bottom:2px solid var(--border);}
.tab{padding:10px 16px;border:none;background:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.87em;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.15s;}
.tab.active{color:var(--teal);border-bottom-color:var(--teal);font-weight:700;}
.panel{display:none;} .panel.active{display:block;}

/* ── FILE UPLOAD ── */
.upload-area{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;
  cursor:pointer;transition:all 0.2s;background:white;}
.upload-area:hover{border-color:var(--teal);background:#f0fafa;}
.upload-area input{display:none;}
.upload-area .hint{color:var(--muted);font-size:0.84em;}
.attach-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.attach-item{position:relative;display:inline-block;}
.attach-img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer;}
.attach-file{display:flex;align-items:center;gap:6px;background:var(--warm);border-radius:8px;
  padding:6px 10px;font-size:0.78em;color:var(--ink);max-width:140px;}
.attach-file svg{flex-shrink:0;}
.attach-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attach-remove{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;
  background:var(--red);color:white;border:none;font-size:0.65em;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}

/* ── BUTTONS ── */
.btn{padding:10px 20px;border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.86em;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.13);}
.btn-save{background:var(--teal);color:white;}
.btn-report{background:var(--green);color:white;}
.btn-outline{background:white;color:var(--ink);border:2px solid var(--border);}
.btn-danger{background:var(--red);color:white;}
.btn-sm{padding:7px 13px;font-size:0.78em;}

/* ── HISTORY ── */
.history-list{display:flex;flex-direction:column;gap:12px;}
.hcard{background:white;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  cursor:pointer;transition:all 0.2s;border-left:4px solid transparent;position:relative;}
.hcard-menu-btn{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;
  font-size:1.1em;color:var(--muted);padding:2px 6px;border-radius:6px;line-height:1;}
.hcard-menu-btn:hover{background:var(--warm);}
.hcard-dropdown{position:absolute;top:30px;right:10px;background:white;border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:100;min-width:100px;overflow:hidden;}
.hcard-dropdown button{width:100%;padding:10px 16px;background:none;border:none;cursor:pointer;
  font-size:0.84em;text-align:left;color:var(--red);font-family:'Plus Jakarta Sans',sans-serif;}
.hcard-dropdown button:hover{background:#fff0f0;}
.hcard:hover{transform:translateX(3px);}
.hcard-date{font-size:0.76em;color:var(--muted);margin-bottom:3px;}
.hcard-member{font-size:0.8em;font-weight:700;margin-bottom:7px;}
.hcard-preview{font-size:0.86em;color:var(--ink);line-height:1.5;}
.hcard-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.hcard-tag{font-size:0.7em;padding:2px 8px;border-radius:20px;background:var(--warm);color:var(--muted);font-weight:600;}
.hcard-tag.filled{background:#e8f5f0;color:var(--green);}
.hcard-imgs{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
.hcard-img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:2px solid var(--border);}

/* ══ REPORT SCREEN ══ */
#reportScreen{flex-direction:column;min-height:100vh;}
.report-topbar{background:var(--teal-dark);padding:0 24px;height:56px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:200;}
.report-topbar-left{display:flex;align-items:center;gap:14px;}
.back-btn{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,0.8);
  background:rgba(255,255,255,0.1);border:none;padding:7px 14px;border-radius:20px;
  cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.82em;font-weight:600;transition:all 0.2s;}
.back-btn:hover{background:rgba(255,255,255,0.2);color:white;}
.report-topbar-title{font-family:'Playfair Display',serif;color:white;font-size:1.1em;}
.report-topbar-right{display:flex;gap:8px;}

.report-layout{display:grid;grid-template-columns:260px 1fr;flex:1;min-height:calc(100vh - 56px);}
.report-sidebar{background:var(--teal);padding:18px 12px;overflow-y:auto;}
.report-sidebar-title{font-size:0.63em;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,0.4);margin-bottom:10px;}
.report-list-item{padding:10px 12px;border-radius:10px;cursor:pointer;transition:all 0.15s;
  color:rgba(255,255,255,0.75);font-size:0.83em;border-left:3px solid transparent;margin-bottom:4px;}
.report-list-item:hover{background:rgba(255,255,255,0.1);color:white;}
.report-list-item.active{background:rgba(255,255,255,0.18);color:white;font-weight:600;border-left-color:var(--gold);}
.rli-date{font-size:0.75em;color:rgba(255,255,255,0.5);}
.rli-member{display:flex;align-items:center;gap:6px;margin-top:2px;}
.rli-dot{width:7px;height:7px;border-radius:50%;}

.report-main{background:var(--cream);padding:28px 32px;overflow-y:auto;}
.report-card{background:white;border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);
  border-left:4px solid var(--teal);}
.report-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;}
.report-card-title{font-family:'Playfair Display',serif;font-size:1.2em;color:var(--teal-dark);overflow-wrap:break-word;word-break:break-word;}
.report-card-meta{font-size:0.8em;color:var(--muted);margin-top:4px;}
.report-card-actions{display:flex;gap:8px;flex-shrink:0;}
.report-body{font-size:0.88em;line-height:1.85;color:var(--ink);
  background:var(--cream);padding:18px;border-radius:10px;margin-bottom:16px;overflow-wrap:break-word;word-break:break-word;}
.report-body.md-content h1,.report-body.md-content h2,.report-body.md-content h3{font-family:'Playfair Display',serif;color:var(--teal-dark);margin:14px 0 6px;}
.report-body.md-content h1{font-size:1.15em;} .report-body.md-content h2{font-size:1.05em;} .report-body.md-content h3{font-size:0.95em;}
.report-body.md-content ul,.report-body.md-content ol{padding-left:20px;margin:6px 0;}
.report-body.md-content li{margin:3px 0;}
.report-body.md-content strong{font-weight:700;color:var(--ink);}
.report-body.md-content em{font-style:italic;}
.report-body.md-content p{margin:5px 0;}
.report-body.md-content hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.report-export-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.btn-excel{background:var(--green);color:white;}
.btn-pdf{background:#e74c3c;color:white;}
.report-empty{text-align:center;padding:80px 20px;color:var(--muted);}
.report-empty .icon{font-size:3em;margin-bottom:12px;}

.report-loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px 0;font-size:0.9em;}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--teal);
  border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── MEMBER FILTER TABS ── */
.member-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.mf-btn{padding:5px 12px;border:2px solid rgba(255,255,255,0.2);border-radius:20px;
  background:none;color:rgba(255,255,255,0.65);font-size:0.76em;font-weight:600;cursor:pointer;transition:all 0.15s;}
.mf-btn:hover{border-color:rgba(255,255,255,0.5);color:white;}
.mf-btn.active{background:white;color:var(--teal-dark);border-color:white;}

/* ── TOAST / LOADING ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:white;
  padding:12px 22px;border-radius:12px;font-size:0.87em;font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,0.25);transform:translateY(80px);opacity:0;
  transition:all 0.3s;z-index:999;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}
.loading-overlay{position:fixed;inset:0;background:rgba(18,59,122,0.90);display:none;
  flex-direction:column;align-items:center;justify-content:center;z-index:500;}
.loading-overlay.show{display:flex;}
.loading-text{color:white;font-size:0.94em;margin-top:16px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .icon{font-size:3em;margin-bottom:10px;}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;
  align-items:center;justify-content:center;z-index:600;}
.confirm-overlay.show{display:flex;}
.confirm-box{background:white;border-radius:16px;padding:28px;max-width:320px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.confirm-title{font-family:'Playfair Display',serif;font-size:1.1em;margin-bottom:10px;color:var(--ink);}
.confirm-msg{font-size:0.86em;color:var(--muted);margin-bottom:20px;line-height:1.6;}
.confirm-btns{display:flex;gap:10px;justify-content:center;}

/* ── QUILL ── */
.quill-wrap{border:2px solid var(--border);border-radius:10px;background:white;transition:border-color 0.2s;}
.quill-wrap:focus-within{border-color:var(--teal);}
.quill-wrap .ql-container{border:none;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.89em;color:var(--ink);}
.quill-wrap .ql-editor{min-height:78px;line-height:1.8;padding:11px 13px;}
.quill-wrap .ql-editor.ql-blank::before{color:#9ca3af;font-style:normal;}
.quill-wrap.readonly{background:var(--warm);pointer-events:none;opacity:0.7;}
.report-main .quill-wrap .ql-editor{min-height:320px;}
#modalQuillWrap .ql-editor{min-height:160px;}

/* ── TASK CARDS ── */
.task-card{background:white;border-radius:12px;padding:18px 20px;margin-bottom:14px;
  box-shadow:var(--shadow);border-left:4px solid var(--teal);}
.task-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.task-title{font-weight:700;font-size:1em;color:var(--ink);overflow-wrap:break-word;word-break:break-word;}
.task-content{font-size:0.88em;line-height:1.8;color:var(--ink);margin-bottom:12px;overflow-wrap:break-word;word-break:break-word;}
.task-content:empty{display:none;}
.task-content.ql-editor{padding:0 !important;font-size:0.88em;line-height:1.8;border:none !important;box-shadow:none !important;}
.task-content.ql-editor ol,.task-content.ql-editor ul{padding-left:1.5em;}
.task-content.ql-editor .ql-indent-1{padding-left:2em;}
.task-content.ql-editor .ql-indent-2{padding-left:4em;}

/* Quill 들여쓰기 목록 카운터 리셋 — 에디터 & 카드 표시 공통 */
/* 이 규칙은 반드시 아래 indent-1 규칙보다 먼저 와야 함 */
.ql-editor ol li.ql-indent-1,
.task-content.ql-editor ol li.ql-indent-1 {
  counter-reset: list-1;
}
/* 각 상위 항목 변경 시 하위 카운터 리셋 */
.ql-editor ol > li {
  counter-increment: list-0;
  counter-reset: list-1;
}
.ql-editor ol li.ql-indent-1 {
  counter-increment: list-1;
  counter-reset: list-2;
}
.ql-editor ol li.ql-indent-1:before {
  content: counter(list-1, lower-alpha) '. ';
}

/* ── COMMENTS ── */
.comment-section{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
.comment-item{display:flex;gap:8px;margin-bottom:8px;font-size:0.82em;align-items:baseline;flex-wrap:wrap;}
.comment-author{font-weight:700;flex-shrink:0;}
.comment-text{color:var(--ink);flex:1;overflow-wrap:break-word;word-break:break-word;}
.comment-date{color:var(--muted);font-size:0.88em;flex-shrink:0;}
.comment-input-row{display:flex;gap:8px;margin-top:10px;}
.comment-input{flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:8px;
  font-size:0.84em;outline:none;font-family:'Plus Jakarta Sans',sans-serif;transition:border-color 0.2s;}
.comment-input:focus{border-color:var(--teal);}

/* ── TASK MODAL ── */
.task-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:flex;align-items:center;justify-content:center;z-index:700;}
.task-modal{background:white;border-radius:16px;padding:28px;width:90%;max-width:560px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:90vh;overflow-y:auto;}

/* ── REQUEST PANEL ── */
.req-card{background:white;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  border-left:4px solid var(--border);margin-bottom:12px;transition:all 0.2s;}
.req-card.pending{border-left-color:#d4a017;}
.req-card.done{border-left-color:var(--green);opacity:0.72;}
.req-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.req-date{font-size:0.72em;color:var(--muted);}
.req-from{font-size:0.74em;font-weight:700;padding:2px 9px;border-radius:20px;color:white;}
.req-status{font-size:0.74em;font-weight:700;padding:3px 10px;border-radius:20px;}
.req-status.pending{background:#fff3cd;color:#856404;}
.req-status.done{background:#d1f5e0;color:#1a7a52;}
.req-title{font-weight:700;font-size:0.95em;margin-bottom:5px;color:var(--ink);overflow-wrap:break-word;word-break:break-word;}
.req-content{font-size:0.85em;color:var(--muted);line-height:1.65;overflow-wrap:break-word;word-break:break-word;}
.req-actions{margin-top:10px;display:flex;justify-content:flex-end;}

@media(max-width:700px){
  .app-layout{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .report-layout{grid-template-columns:1fr;}
  .report-sidebar{display:none;}
  .main-area,.report-main{padding:16px;}
}

/* ── NOTIFICATION BADGE ── */
.notif-badge {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  border-radius:9px;
  background:var(--red);
  color:white;
  font-size:0.68em;
  font-weight:700;
  padding:0 4px;
  margin-left:5px;
}

/* ── NOTICES SIDEBAR ── */
.notice-sidebar-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.notice-sidebar-label-row .sidebar-label{margin-bottom:0;}
.notice-add-btn{width:100%;margin-top:7px;padding:7px 0;background:rgba(255,255,255,0.1);
  border:1px dashed rgba(255,255,255,0.28);border-radius:8px;color:rgba(255,255,255,0.65);
  font-size:0.78em;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
  transition:all 0.15s;letter-spacing:0.3px;}
.notice-add-btn:hover{background:rgba(255,255,255,0.2);color:white;}
.notice-item{padding:7px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:flex-start;
  gap:7px;color:rgba(255,255,255,0.72);font-size:0.82em;transition:all 0.12s;}
.notice-item:hover{background:rgba(255,255,255,0.1);color:white;}
.notice-dot{width:7px;height:7px;border-radius:50%;background:white;flex-shrink:0;
  margin-top:4px;opacity:0;transition:opacity 0.15s;}
.notice-dot.unread{opacity:1;}
.notice-item-info{flex:1;min-width:0;}
.notice-item-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.notice-item-date{font-size:0.81em;color:rgba(255,255,255,0.38);margin-top:1px;}

/* ── NOTICE MODAL ── */
.notice-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;
  align-items:center;justify-content:center;z-index:700;}
.notice-overlay.show{display:flex;}
.notice-modal{background:white;border-radius:18px;padding:28px;width:90%;max-width:540px;
  max-height:88vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.3);}
.notice-modal-title{font-family:'Playfair Display',serif;font-size:1.15em;color:var(--teal-dark);margin-bottom:0;}
.notice-field-label{font-size:0.73em;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--muted);display:block;margin-bottom:5px;}
.notice-field-input{width:100%;padding:10px 13px;border:2px solid var(--border);border-radius:8px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:0.9em;outline:none;
  transition:border-color 0.2s;box-sizing:border-box;}
.notice-field-input:focus{border-color:var(--teal);}
.notice-textarea{resize:vertical;min-height:100px;}
.notice-detail-head{margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.notice-detail-title-text{font-family:'Playfair Display',serif;font-size:1.08em;color:var(--ink);margin-bottom:4px;}
.notice-detail-meta{font-size:0.78em;color:var(--muted);}
.notice-detail-body{font-size:0.9em;line-height:1.85;color:var(--ink);white-space:pre-wrap;margin-bottom:18px;}

/* ── LOGIN / PROFILE SCREENS ── */
#loginScreen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--teal-dark),var(--teal) 60%,var(--teal-light));padding:24px;}
#profileScreen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,var(--teal-dark),var(--teal) 60%,var(--teal-light));padding:24px;}
.color-opt{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s;}
.color-opt.selected{border-color:var(--ink);transform:scale(1.15);}
/* ── ADMIN TABLE ── */
.admin-table{width:100%;border-collapse:collapse;font-size:0.88em;}
.admin-table th{text-align:left;padding:8px 12px;background:var(--warm);color:var(--muted);font-size:0.75em;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--border);}
</style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen" class="screen">
  <div class="pin-card">
    <div class="pin-logo">📋</div>
    <div class="pin-title">TeamWork</div>
    <div class="pin-sub">Easytech团队工作系统</div>
    <div style="margin-bottom:12px;">
      <label class="pin-label" for="loginEmail">이메일</label>
      <input type="email" id="loginEmail" class="pin-input" placeholder="name@easytech-qd.cn" autocomplete="email">
    </div>
    <div style="margin-bottom:8px;">
      <label class="pin-label" for="loginPassword">비밀번호 (6자리 이상)</label>
      <input type="password" id="loginPassword" class="pin-input" placeholder="••••••" autocomplete="current-password">
    </div>
    <div style="font-size:0.76em;color:var(--muted);margin-bottom:16px;line-height:1.6;">
      처음에는 이메일 인증이 필요합니다. 이후에는 같은 이메일과 비밀번호만 입력하면 바로 로그인됩니다.
    </div>
    <button class="pin-login-btn" id="loginBtn" onclick="doLogin()">가입 / 로그인</button>
    <div class="pin-error" id="loginError" style="display:none;"></div>
  </div>
</div>

<!-- ══ PROFILE SETUP SCREEN ══ -->
<div id="profileScreen" class="screen">
  <div class="pin-card">
    <div class="pin-logo">👤</div>
    <div class="pin-title">프로필 설정</div>
    <div class="pin-sub" style="margin-bottom:20px;">처음 접속입니다. 이름과 색상을 설정하세요.</div>
    <div style="margin-bottom:12px;">
      <label class="pin-label" for="profileName">표시 이름</label>
      <input type="text" id="profileName" class="pin-input" placeholder="이름 입력 (예: JP, Beryl)">
    </div>
    <div style="margin-bottom:18px;">
      <label class="pin-label">색상 선택</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
        <div class="color-opt selected" data-color="#e05252" style="background:#e05252;" onclick="selectProfileColor('#e05252')"></div>
        <div class="color-opt" data-color="#3b6ea8" style="background:#3b6ea8;" onclick="selectProfileColor('#3b6ea8')"></div>
        <div class="color-opt" data-color="#c9973a" style="background:#c9973a;" onclick="selectProfileColor('#c9973a')"></div>
        <div class="color-opt" data-color="#2e9e6b" style="background:#2e9e6b;" onclick="selectProfileColor('#2e9e6b')"></div>
        <div class="color-opt" data-color="#9b59b6" style="background:#9b59b6;" onclick="selectProfileColor('#9b59b6')"></div>
        <div class="color-opt" data-color="#e67e22" style="background:#e67e22;" onclick="selectProfileColor('#e67e22')"></div>
      </div>
    </div>
    <button class="pin-login-btn" onclick="saveProfile()">시작하기</button>
    <div id="profileError" style="color:var(--red);font-size:0.82em;margin-top:10px;min-height:1.2em;"></div>
  </div>
</div>

<!-- ══ MAIN APP SCREEN ══ -->
<div id="appScreen" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">📋 TeamWork</div>
      <div class="badge-wrap">
        <div class="member-badge" onclick="toggleBadgeMenu()">
          <div class="badge-av" id="topBadgeAv"></div>
          <span class="badge-name" id="topBadgeName"></span>
          <span style="color:rgba(255,255,255,0.45);font-size:0.8em;margin-left:2px;">▾</span>
        </div>
        <div class="badge-dropdown" id="badgeDropdown" style="display:none;">
          <div class="badge-dd-label">团队成员</div>
          <div id="badgeMemberList"></div>
          <div class="badge-dd-divider"></div>
          <button onclick="closeBadgeMenu();doLogout();">로그아웃</button>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn btn-reports-nav" onclick="goReportScreen()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        报告管理
      </button>
    </div>
  </div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="calendar">
        <div class="cal-header">
          <button class="cal-nav" onclick="calPrev()">‹</button>
          <div class="cal-month" id="calMonth"></div>
          <button class="cal-nav" onclick="calNext()">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">搜索</div>
        <div class="search-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="searchInput" placeholder="업무 내용 검색..." oninput="doSearch()"/>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
      <div class="sidebar-section" id="noticeSection">
        <div class="notice-sidebar-label-row">
          <div class="sidebar-label">公告</div>
          <span class="notif-badge" id="noticeBadge" style="display:none;margin-left:0;"></span>
        </div>
        <div id="noticeList"></div>
        <button class="notice-add-btn" onclick="openNoticeWrite()">+ 新公告</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">团队成员</div>
        <div class="team-list" id="teamList"></div>
      </div>
    </aside>

    <main class="main-area">
      <div class="date-header">
        <div>
          <div class="date-title" id="mainDateTitle"></div>
          <div class="date-sub" id="mainDateSub"></div>
        </div>
        <div id="viewingBadge"></div>
      </div>
      <div class="stats-row" id="statsRow"></div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('write',this)">✏️ 工作输入</button>
        <button class="tab" onclick="switchTab('history',this)">📚 全部记录</button>
        <button id="requestTab" class="tab" onclick="switchTab('request',this)">✉️ 申请事项</button>
      </div>

      <!-- WRITE PANEL -->
      <div class="panel active" id="writePanel">
        <div id="addTaskBtnRow" style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px;">
          <button class="btn btn-report" onclick="generateReport()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            生成报告
          </button>
          <button class="btn btn-save" onclick="addTaskModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加工作
          </button>
        </div>
        <div id="taskListContainer"></div>
      </div>

      <!-- HISTORY PANEL -->
      <div class="panel" id="historyPanel">
        <div id="historyList" class="history-list"></div>
      </div>

      <!-- REQUEST PANEL -->
      <div class="panel" id="requestPanel">
        <div id="addRequestBtnRow" style="display:flex;justify-content:flex-end;margin-bottom:14px;">
          <button class="btn btn-save" onclick="addRequestModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            요청 추가
          </button>
        </div>
        <div id="requestList"></div>
      </div>
    </main>
  </div>
</div>

<!-- ══ REPORT SCREEN ══ -->
<div id="reportScreen" class="screen">
  <div class="report-topbar">
    <div class="report-topbar-left">
      <button class="back-btn" onclick="goBack()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        返回主页
      </button>
      <div class="report-topbar-title">📊 报告管理</div>
    </div>
    <div class="report-topbar-right">
      <button class="icon-btn btn-excel" onclick="exportAllExcel()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 9 6 6m0-6-6 6"/></svg>
        全部导出
      </button>
    </div>
  </div>

  <div class="report-layout">
    <aside class="report-sidebar">
      <div class="report-sidebar-title">成员筛选</div>
      <div class="member-filter" id="reportMemberFilter"></div>
      <div class="report-sidebar-title" style="margin-top:14px;">报告列表</div>
      <div id="reportSideList"></div>
    </aside>
    <main class="report-main">
      <div id="reportContent">
        <div class="report-empty">
          <div class="icon">📄</div>
          <p>请从左侧选择报告</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ══ NOTICE WRITE MODAL ══ -->
<div class="notice-overlay" id="noticeWriteOverlay">
  <div class="notice-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div class="notice-modal-title">📢 新公告</div>
      <button onclick="closeNoticeWrite()" style="background:none;border:none;font-size:1.3em;cursor:pointer;color:var(--muted);">✕</button>
    </div>
    <div style="margin-bottom:12px;">
      <label class="notice-field-label">标题</label>
      <input type="text" id="noticeTitleInput" class="notice-field-input" placeholder="공지 제목을 입력하세요">
    </div>
    <div style="margin-bottom:18px;">
      <label class="notice-field-label">内容</label>
      <textarea id="noticeBodyInput" class="notice-field-input notice-textarea" placeholder="공지 내용을 입력하세요" rows="5"></textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeNoticeWrite()">取消</button>
      <button class="btn btn-save" onclick="submitNotice()">保存</button>
    </div>
  </div>
</div>

<!-- ══ NOTICE DETAIL MODAL ══ -->
<div class="notice-overlay" id="noticeDetailOverlay">
  <div class="notice-modal" id="noticeDetailBox"></div>
</div>

<!-- ══ ADMIN MEMBER MANAGEMENT OVERLAY ══ -->
<div class="confirm-overlay" id="adminMembersOverlay" style="z-index:800;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:18px;padding:28px;width:92%;max-width:640px;
    max-height:85vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.3);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <div style="font-family:'Playfair Display',serif;font-size:1.1em;color:var(--teal-dark);">👑 멤버 관리</div>
      <button onclick="closeAdminMembers()" style="background:none;border:none;font-size:1.3em;cursor:pointer;color:var(--muted);">✕</button>
    </div>
    <div id="adminMemberTable"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>
<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner" style="width:40px;height:40px;border-width:3px;"></div>
  <div class="loading-text" id="loadingText">处理中...</div>
</div>
<!-- CONFIRM -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">确认删除</div>
    <div class="confirm-msg" id="confirmMsg">确定要删除吗？</div>
    <div class="confirm-btns">

function fmtDate(s) {

function fmtShort(s) {

  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();

async function doLogin(){
  const email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
  const password = document.getElementById('loginPassword').value || '';
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none'; errEl.style.color = 'var(--red)';

  if(!email || !password){
    errEl.textContent = '이메일과 비밀번호를 입력하세요'; errEl.style.display = 'block'; return;
  }
  if(password.length < 6){
    errEl.textContent = '비밀번호는 6자리 이상이어야 합니다'; errEl.style.display = 'block'; return;
  }

  document.getElementById('loginBtn').disabled = true;
  showLoading('로그인 중...');
  sbUrl = CONFIG.SUPABASE_URL; sbKey = CONFIG.SUPABASE_KEY; emailDomain = CONFIG.EMAIL_DOMAIN;

  // 1. Try sign in first
  try {
    const r = await fetch(`${sbUrl}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{'apikey':sbKey,'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if(r.ok && data.access_token){
      authSession = data;
      localStorage.setItem('auth_session', JSON.stringify(data));
      await afterAuth();
      return;
    }
  } catch(e){ /* fall through to signup */ }

  // 2. Sign in failed → try sign up (company domain only)
  const domain = email.split('@')[1];
  if(domain !== CONFIG.EMAIL_DOMAIN){
    hideLoading(); document.getElementById('loginBtn').disabled = false;
    errEl.textContent = `회사 이메일(${CONFIG.EMAIL_DOMAIN})로만 가입 가능합니다`;
    errEl.style.display = 'block'; return;
  }

  try {
    const r2 = await fetch(`${sbUrl}/auth/v1/signup`, {
      method:'POST',
      headers:{'apikey':sbKey,'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data2 = await r2.json();
    if(!r2.ok) throw new Error(data2.msg || data2.message || '가입 실패');

    if(data2.access_token){
      authSession = data2;
      localStorage.setItem('auth_session', JSON.stringify(data2));
      await afterAuth();
    } else {
      // Email confirmation required
      hideLoading(); document.getElementById('loginBtn').disabled = false;
      errEl.style.color = 'var(--green)';
      errEl.textContent = '인증 메일이 발송되었습니다. 메일의 링크를 클릭한 후 다시 로그인하세요.';
      errEl.style.display = 'block';
    }
  } catch(e){
    hideLoading(); document.getElementById('loginBtn').disabled = false;
    errEl.style.color = 'var(--red)';
    errEl.textContent = '로그인/가입 실패: ' + (e.message || '다시 시도하세요');
    errEl.style.display = 'block';
  }
}

async function migrateLocalRequests(){
  const legacy=JSON.parse(localStorage.getItem(REQ_KEY)||'[]');
  if(!legacy.length || demoMode) return;
  let migrated=0;
  for(const req of legacy){
    try {
      const r=await sbFetch('requests',{method:'POST',prefer:'return=minimal',body:JSON.stringify(req)});
      if(r.ok) migrated++;
    } catch(e){}
  }
  if(migrated===legacy.length){
    localStorage.removeItem(REQ_KEY);
    if(migrated>0) showToast(`✅ 요청 ${migrated}건 DB 이전 완료`,'success');
  } else if(migrated>0){
    console.warn(`[migrate] ${migrated}/${legacy.length}건만 이전됨`);
  }
}

async function fetchFreshData(){
  await migrateLocalRequests();
  try {
    const [r1,r2,r3]=await Promise.all([
      sbFetch('daily_logs?select=*&order=log_date.desc'),
      sbFetch('requests?select=*&order=created_at.desc'),
      sbFetch('request_comments?select=*&order=created_at.asc')
    ]);
    let updated=false;
    if(r1.ok){ allLogs=await r1.json(); localStorage.setItem(SB_CACHE,JSON.stringify(allLogs)); updated=true; }
    else { console.warn('[fetchFreshData] daily_logs 실패: HTTP', r1.status); }
    if(r2.ok){ allRequests=await r2.json(); localStorage.setItem(SB_REQ_CACHE,JSON.stringify(allRequests)); }
    else { console.warn('[fetchFreshData] requests 실패: HTTP', r2.status); }
    if(r3.ok){ allRequestComments=await r3.json(); localStorage.setItem(RC_CACHE,JSON.stringify(allRequestComments)); }
    else { console.warn('[fetchFreshData] request_comments 실패: HTTP', r3.status); }
    if(updated) renderMain();
    else { renderTeamList(); updateNotifBadges(); }
  } catch(e){ console.warn('[fetchFreshData] 네트워크 에러:', e.message); }
}

function applyLocalLog(member, date, fields) {
  const idx = allLogs.findIndex(l => l.member_name === member && l.log_date === date);
  const now = new Date().toISOString();
  if (idx >= 0) {
    allLogs[idx] = { ...allLogs[idx], ...fields, updated_at: now };
  } else {
    allLogs.unshift({ id: 'temp_' + Date.now(), member_name: member, log_date: date, ...fields, updated_at: now });
  }
}

  if(demoMode){
    const idx=allLogs.findIndex(l=>l.member_name===member&&l.log_date===date);
    const entry={id:Date.now().toString(),member_name:member,log_date:date,...fields,updated_at:new Date().toISOString()};
    if(idx>=0) allLogs[idx]={...allLogs[idx],...entry}; else allLogs.unshift(entry);
    localStorage.setItem(DEMO_KEY,JSON.stringify(allLogs)); return true;
  }
  const attempt=async()=>{
    const existing=getLog(member,date);
    const hasRealId=existing&&existing.id&&!String(existing.id).startsWith('temp_');
    if(hasRealId){
      const r=await sbFetch(`daily_logs?id=eq.${existing.id}`,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify({...fields,updated_at:new Date().toISOString()})});
      if(!r.ok) throw new Error();
    } else {
      const r=await sbFetch('daily_logs',{method:'POST',prefer:'return=minimal',body:JSON.stringify({member_name:member,log_date:date,...fields})});
      if(!r.ok) throw new Error();
    }
    return true;
  };
  try { return await attempt(); }
  catch(e){
    try {
      await new Promise(res=>setTimeout(res,3000));
      return await attempt();
    } catch(e2){ showToast('保存失败','error'); return false; }
  }
}

async function deleteLog(id){
  if(demoMode){
    allLogs=allLogs.filter(l=>l.id!==id);
    localStorage.setItem(DEMO_KEY,JSON.stringify(allLogs)); return true;

  try {
    const r=await sbFetch(`daily_logs?id=eq.${id}`,{method:'DELETE'});
    if(!r.ok) throw new Error();
    return true;
  } catch(e){ showToast('删除失败','error'); return false; }
}

//  TASKS — LEGACY COMPAT
// ════════════════════════════════════════
function getTasksForLog(log) {
  if (!log) return [];
  if (log.tasks && log.tasks.length > 0) return log.tasks;
  if (log.meetings) return [{
    task_id: log.id + '_legacy',
    title: '업무기록',
    content: log.meetings,
    attachments: log.attachments || [],
    comments: [],
    created_at: log.updated_at || log.log_date,
    _legacy: true
  }];
  return [];
}

function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function renderCalendar(){
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMonth').textContent=`${calYear}년 ${months[calMonth]}`;
  const grid=document.getElementById('calGrid');
  const dows=['일','월','화','수','목','금','토'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<first;i++) html+='<div class="cal-cell empty"></div>';
  const ts=todayStr();
  for(let d=1;d<=days;d++){
    const k=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=allLogs.some(l=>l.log_date===k&&l.member_name===viewingMember&&(l.tasks?.length>0||l.meetings));
    let cls='cal-cell';
    if(k===ts) cls+=' today';
    if(k===currentDate) cls+=' selected';
    if(has) cls+=' has-log';
    html+=`<div class="${cls}" onclick="selectDate('${k}')">${d}</div>`;
  }
  grid.innerHTML=html;
}
function selectDate(date){
  currentDate=date;
  const d=new Date(date+'T00:00:00');
  calYear=d.getFullYear(); calMonth=d.getMonth();
  renderCalendar(); renderMain();
}

// ════════════════════════════════════════
function getUnreadCount(fromMember, toMember){
  const lastSeen = localStorage.getItem(`lastSeen_${fromMember}_${toMember}`) || '2000-01-01';

  const newRequests = allRequests.filter(r =>
    r.to_member === toMember && r.created_at > lastSeen
  ).length;

  const newTaskComments = allLogs
    .filter(l => l.member_name === toMember)
    .reduce((acc, l) => {
      const comments = (l.tasks || []).flatMap(t => t.comments || []);
      return acc + comments.filter(c => c.created_at > lastSeen && c.member_name !== fromMember).length;
    }, 0);

  const toMemberReqIds = new Set(
    allRequests.filter(r => r.to_member === toMember).map(r => r.id)
  );
  const newReqComments = allRequestComments.filter(c =>
    toMemberReqIds.has(c.request_id) &&
    c.created_at > lastSeen &&
    c.member_name !== fromMember
  ).length;

  return newRequests + newTaskComments + newReqComments;
}

function updateNotifBadges(){
  if(!currentMember) return;

  // 요청사항 탭 배지 (현재 보고 있는 팀원 기준)
  const reqTab = document.getElementById('requestTab');
  if(reqTab){
    const cnt = getUnreadCount(currentMember, viewingMember);
    reqTab.innerHTML = cnt > 0
      ? `✉️ 요청사항 <span class="notif-badge">${cnt}</span>`
      : '✉️ 요청사항';
  }

  // topbar 전체 합산 배지
  const total = members
    .filter(m => m.name !== currentMember)
    .reduce((acc, m) => acc + getUnreadCount(currentMember, m.name), 0);
  let topBadge = document.getElementById('topbarNotifBadge');
  if(total > 0){
    if(!topBadge){
      topBadge = document.createElement('span');
      topBadge.id = 'topbarNotifBadge';
      topBadge.className = 'notif-badge';
      document.getElementById('topBadgeName').after(topBadge);
    }
    topBadge.textContent = total;
  } else {
    if(topBadge) topBadge.remove();
  }
}

function renderTaskList(){
  const container=document.getElementById('taskListContainer');
  const isMe=viewingMember===currentMember;

  // 같은 날짜의 모든 레코드 수집
  const dayLogs=getLogs(viewingMember,currentDate);

  // 버튼 행 표시/숨김
  const btnRow=document.getElementById('addTaskBtnRow');
  if(btnRow) btnRow.style.display=isMe?'flex':'none';

  // 각 레코드의 tasks를 원본 log 참조와 함께 수집
  const allTaskPairs=dayLogs.flatMap(log=>
    getTasksForLog(log).map(task=>({log,task}))
  );

  if(!allTaskPairs.length){
    container.innerHTML=`<div class="empty-state"><div class="icon">📝</div><p>${isMe?'请添加工作内容':'暂无工作记录'}</p></div>`;
    return;
  }
  container.innerHTML=allTaskPairs.map(({log,task})=>renderTaskCard(log,task,isMe)).join('');
}

function renderTaskCard(log,task,isMe){
  const attachments=task.attachments||[];
  const comments=task.comments||[];
  const isLegacy=!!task._legacy;

  const imgsHtml=attachments.filter(a=>a.type==='image')
    .map(a=>`<div class="attach-item"><img src="${a.data}" class="attach-img" onclick="window.open(this.src)"></div>`).join('');
  const filesHtml=attachments.filter(a=>a.type==='file')
    .map(a=>`<a href="${a.data}" download="${escapeHtml(a.name)}" class="attach-file" style="text-decoration:none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>${escapeHtml(a.name)}</span></a>`).join('');

  const commentsHtml=comments.map(c=>{
    const isMyComment=c.author===currentMember;
    return `<div class="comment-item">
      <span class="comment-author" style="color:${memberColor(c.author)}">${escapeHtml(c.author)}</span>
      <span class="comment-text">${escapeHtml(c.text)}</span>
      <span class="comment-date">${fmtCommentDate(c.created_at)}</span>
      ${isMyComment?`<button style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:0.85em;padding:0 2px;" onclick="deleteComment('${log.id}','${task.task_id}','${c.comment_id}')">🗑️</button>`:''}
    </div>`;
  }).join('');

  const logId=log.id;
  const taskId=task.task_id;

  return `<div class="task-card" id="tcard-${taskId}" data-task-id="${taskId}">
    <div class="task-card-header">
      <div class="task-title">🏷 ${escapeHtml(task.title||'(제목 없음)')}</div>
      ${renderCardButtons(log, task)}
    </div>
    <div class="task-content ql-editor" style="padding:0;">${task.content||''}</div>
    ${attachments.length?`<div class="attach-grid" style="margin-bottom:12px;">${imgsHtml}${filesHtml}</div>`:''}
    <div class="comment-section">
      <div style="font-size:0.82em;color:var(--muted);margin-bottom:8px;">💬 评论 ${comments.length}条</div>
      ${commentsHtml}
      ${!isLegacy?`<div class="comment-input-row">
        <input type="text" class="comment-input" id="ci-${taskId}"
          placeholder="댓글을 입력하세요..."
          onkeydown="if(event.key==='Enter')addComment('${logId}','${taskId}')">
        <button class="btn btn-save btn-sm" onclick="addComment('${logId}','${taskId}')">提交</button>
      </div>`:'<div style="font-size:0.78em;color:var(--muted);margin-top:6px;">이전 기록 형식 — 댓글 미지원</div>'}
    </div>
  </div>`;
}

function closeTaskModal(){
  const overlay=document.getElementById('taskModalOverlay');
  if(overlay) overlay.remove();
  modalQuill=null; modalAttachments=[];
}

function handleModalFiles(e){ processFilesTo(Array.from(e.target.files),modalAttachments,renderModalAttachments); e.target.value=''; }
function handleModalDrop(e){ e.preventDefault(); processFilesTo(Array.from(e.dataTransfer.files),modalAttachments,renderModalAttachments); }

function processFilesTo(files,arr,renderFn){
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const isImg=file.type.startsWith('image/');
      arr.push({type:isImg?'image':'file',name:file.name,data:ev.target.result,mime:file.type});
      renderFn();
    };
    reader.readAsDataURL(file);
  });
}

function renderModalAttachments(){
  const grid=document.getElementById('modalAttachPreview');
  if(!grid) return;
  grid.innerHTML=modalAttachments.map((a,i)=>{
    if(a.type==='image') return `<div class="attach-item"><img src="${a.data}" class="attach-img"><button class="attach-remove" onclick="removeModalAttach(${i})">✕</button></div>`;
    return `<div class="attach-item"><div class="attach-file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>${escapeHtml(a.name)}</span></div><button class="attach-remove" onclick="removeModalAttach(${i})">✕</button></div>`;
  }).join('');
}
function removeModalAttach(i){ modalAttachments.splice(i,1); renderModalAttachments(); }

async function saveTask(taskId){
    if(saveTask._saving) return;
    saveTask._saving=true;
    taskId=taskId||null;
    const titleEl=document.getElementById('taskTitleInput');
    const title=(titleEl?titleEl.value:'').trim();
    if(!title){ showToast('업무 제목을 입력하세요','error'); saveTask._saving=false; return; }
    const content=modalQuill?(modalQuill.getText().trim()?modalQuill.root.innerHTML:''):'';
    const existingLog=getLog(currentMember,currentDate);
    const snapshot=existingLog?{...existingLog}:null;
    let tasks=existingLog?[...(existingLog.tasks||[])]:[];
    if(taskId){
      const idx=tasks.findIndex(t=>t.task_id===taskId);
      if(idx>=0) tasks[idx]={...tasks[idx],title,content,attachments:[...modalAttachments],updated_at:new Date().toISOString()};
    } else {
      tasks.push({
        task_id:genUUID(),title,content,
        attachments:[...modalAttachments],
        comments:[],
        created_at:new Date().toISOString(),
        updated_at:new Date().toISOString()
      });
    }
    const now=new Date().toISOString();
    const logIdx=allLogs.findIndex(l=>l.member_name===currentMember&&l.log_date===currentDate);
    if(logIdx>=0){ allLogs[logIdx]={...allLogs[logIdx],tasks,updated_at:now}; }
    else { allLogs.unshift({id:'temp_'+Date.now(),member_name:currentMember,log_date:currentDate,tasks,updated_at:now}); }
    renderCalendar();
    renderTaskList();
    closeTaskModal();
    showToast('✅ 保存成功','success');
    saveTask._saving=false;
    const ok=await saveLogData(currentMember,currentDate,{tasks});
    if(!ok){
      if(snapshot){ const i=allLogs.findIndex(l=>l.member_name===currentMember&&l.log_date===currentDate); if(i>=0) allLogs[i]=snapshot; }
      else { allLogs=allLogs.filter(l=>!(l.member_name===currentMember&&l.log_date===currentDate)); }
      renderCalendar();
      renderTaskList();
      showToast('❌ 저장 실패 — 재시도 해주세요','error');
    } else {
      const tempIdx=allLogs.findIndex(l=>l.id?.startsWith('temp_')&&l.member_name===currentMember&&l.log_date===currentDate);
      if(tempIdx>=0){
        try{
          const r=await sbFetch(`daily_logs?member_name=eq.${currentMember}&log_date=eq.${currentDate}&select=id&limit=1`);
          if(r.ok){const d=await r.json();if(d[0]?.id) allLogs[tempIdx].id=d[0].id;}
        }catch(e){}
      }
    }
  }

//  DELETE TASK
// ════════════════════════════════════════
async function deleteTask(logId,taskId){
  showConfirm('确认删除','确定要删除此工作吗？',async()=>{
    showLoading('删除中...');
    const log=allLogs.find(l=>l.id===logId);
    if(!log){ hideLoading(); return; }
    const tasks=(log.tasks||[]).filter(t=>t.task_id!==taskId);
    let ok;
    if(tasks.length===0){ ok=await deleteLog(logId); }
    else { ok=await saveLogData(log.member_name,log.log_date,{tasks}); }
    await loadAllLogs();
    renderCalendar();
    renderTaskList();
    renderHistory();
    hideLoading();
    if(ok) showToast('🗑️ 删除成功','success');
  });
}

async function addComment(logId,taskId){
    const input=document.getElementById('ci-'+taskId);
    if(!input) return;
    const text=input.value.trim();
    if(!text) return;
    const log=allLogs.find(l=>l.id===logId);
    if(!log) return;
    const snapshot={...log,tasks:[...(log.tasks||[]).map(t=>({...t,comments:[...(t.comments||[])]}))]};
    const tasks=[...(log.tasks||[])];
    const idx=tasks.findIndex(t=>t.task_id===taskId);
    if(idx<0) return;
    const comments=[...(tasks[idx].comments||[])];
    comments.push({comment_id:genUUID(),author:currentMember,text,created_at:new Date().toISOString()});
    tasks[idx]={...tasks[idx],comments};
    const logIdx=allLogs.findIndex(l=>l.id===logId);
    if(logIdx>=0) allLogs[logIdx]={...allLogs[logIdx],tasks};
    input.value='';
    renderTaskList();
    showToast('💬 댓글이 등록되었습니다','success');
    const ok=await saveLogData(log.member_name,log.log_date,{tasks});
    if(!ok){
      const i=allLogs.findIndex(l=>l.id===logId);
      if(i>=0) allLogs[i]=snapshot;
      renderTaskList();
      showToast('❌ 댓글 저장 실패 — 재시도 해주세요','error');
    }
  }

async function deleteComment(logId,taskId,commentId){
    const log=allLogs.find(l=>l.id===logId);
    if(!log) return;
    const snapshot={...log,tasks:[...(log.tasks||[]).map(t=>({...t,comments:[...(t.comments||[])]}))]};
    const tasks=[...(log.tasks||[])];
    const idx=tasks.findIndex(t=>t.task_id===taskId);
    if(idx<0) return;
    const comments=(tasks[idx].comments||[]).filter(c=>c.comment_id!==commentId);
    tasks[idx]={...tasks[idx],comments};
    const logIdx=allLogs.findIndex(l=>l.id===logId);
    if(logIdx>=0) allLogs[logIdx]={...allLogs[logIdx],tasks};
    renderTaskList();
    const ok=await saveLogData(log.member_name,log.log_date,{tasks});
    if(!ok){
      const i=allLogs.findIndex(l=>l.id===logId);
      if(i>=0) allLogs[i]=snapshot;
      renderTaskList();
      showToast('❌ 삭제 실패 — 재시도 해주세요','error');
    }
  }

// ════════════════════════════════════════
//  HISTORY
// ════════════════════════════════════════
function renderHistory(){
  const list = document.getElementById('historyList');

  const logs = allLogs
    .filter(l => l.member_name === viewingMember)
    .sort((a, b) => b.log_date.localeCompare(a.log_date));

  if(!logs.length){
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无记录</p></div>';
    return;
  }

  // 날짜 기준으로 그룹핑 (같은 날짜 = 카드 1개)
  const grouped = {};
  logs.forEach(l => {
    if(!grouped[l.log_date]){
      grouped[l.log_date] = { ...l, _allLogs: [l] };
    } else {
      grouped[l.log_date]._allLogs.push(l);
      if(Array.isArray(l.tasks)){
        grouped[l.log_date].tasks = [
          ...(grouped[l.log_date].tasks || []),
          ...l.tasks
        ];
      }
      if(l.meetings) grouped[l.log_date].meetings = (grouped[l.log_date].meetings || '') + ' ' + l.meetings;
      if(l.others)   grouped[l.log_date].others   = (grouped[l.log_date].others   || '') + ' ' + l.others;
      if(l.calls)    grouped[l.log_date].calls     = (grouped[l.log_date].calls    || '') + ' ' + l.calls;
      if(l.sns)      grouped[l.log_date].sns       = (grouped[l.log_date].sns      || '') + ' ' + l.sns;
    }
  });

  const groupedLogs = Object.values(grouped)
    .sort((a, b) => b.log_date.localeCompare(a.log_date));

  const visibleLogs = groupedLogs.filter(l => {
    const m      = stripHtml(l.meetings || '').trim();
    const o      = stripHtml(l.others   || '').trim();
    const calls  = stripHtml(l.calls    || '').trim();
    const sns    = stripHtml(l.sns      || '').trim();
    const hasTasks = Array.isArray(l.tasks) && l.tasks.length > 0;
    return m || o || calls || sns || hasTasks;
  });

  if(!visibleLogs.length){
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无记录</p></div>';
    return;
  }

  list.innerHTML = visibleLogs.map(l => {
    const lines = [];

    // 신형: tasks 배열
    if(Array.isArray(l.tasks) && l.tasks.length > 0){
      l.tasks.forEach(t => {
        const title   = typeof t === 'string' ? t : (t.title || t.name || '');
        const content = typeof t === 'object'  ? (t.content || t.body || t.description || '') : '';
        const text    = [title, stripHtml(content).trim()].filter(Boolean).join(': ').slice(0, 100);
        if(text) lines.push(`<div style="font-size:0.84em;margin:3px 0;">
          <span style="font-weight:700;color:var(--teal);">📝</span> ${text}
        </div>`);
      });
    }

    // 구형: meetings, calls, sns, others
    const meetingsText = stripHtml(l.meetings || '').trim();
    const callsText    = stripHtml(l.calls    || '').trim();
    const snsText      = stripHtml(l.sns      || '').trim();
    const othersText   = stripHtml(l.others   || '').trim();

    if(meetingsText) lines.push(`<div style="font-size:0.84em;margin:3px 0;">
      <span style="font-weight:700;color:var(--teal);">📝 工作:</span> ${meetingsText.slice(0,100)}
    </div>`);
    if(callsText) lines.push(`<div style="font-size:0.84em;margin:3px 0;">
      <span style="font-weight:700;color:#3b6ea8;">📞 통화:</span> ${callsText.slice(0,100)}
    </div>`);
    if(snsText) lines.push(`<div style="font-size:0.84em;margin:3px 0;">
      <span style="font-weight:700;color:#2e9e6b;">💬 SNS:</span> ${snsText.slice(0,100)}
    </div>`);
    if(othersText) lines.push(`<div style="font-size:0.84em;margin:3px 0;">
      <span style="font-weight:700;color:var(--muted);">🗒️ 其他:</span> ${othersText.slice(0,100)}
    </div>`);

    const contentHtml = lines.join('');
    const tags = [];
    if(l.report) tags.push(['报告', false]);
    const imgs = (l.attachments||[]).filter(a => a.type==='image').slice(0,3)
      .map(a => `<img src="${a.data}" class="hcard-img">`).join('');
    const m = members.find(x => x.name === l.member_name);

    return `<div class="hcard" style="border-left-color:${m?.color||'#888'};cursor:pointer;"
  onclick="selectDate('${l.log_date}')">
  <div class="hcard-date">${fmtDate(l.log_date)}</div>
  <div class="hcard-member" style="color:${m?.color}">${l.member_name}</div>
  <div class="hcard-preview">${contentHtml}</div>
  <div class="hcard-tags">${tags.map(([t,f])=>`<span class="hcard-tag ${f?'filled':''}">${t}</span>`).join('')}</div>
  ${imgs?`<div class="hcard-imgs">${imgs}</div>`:''}
</div>`;
  }).join('');
}

function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const c=document.getElementById('searchResults');
  if(!q){ c.innerHTML=''; return; }
  const results=allLogs.filter(l=>{
    const tasks=getTasksForLog(l);
    const taskText=tasks.map(t=>stripHtml(t.title+' '+t.content)).join(' ').toLowerCase();
    return taskText.includes(q)||l.report?.toLowerCase().includes(q);
  }).slice(0,15);
  if(!results.length){ c.innerHTML='<div style="color:rgba(255,255,255,0.35);font-size:0.78em;padding:6px;">无结果</div>'; return; }
  c.innerHTML=results.map(l=>{
    const tasks=getTasksForLog(l);
    const preview=tasks.map(t=>stripHtml(t.title+' '+t.content)).join(' ')
      .replace(new RegExp(q,'gi'),m=>`<mark>${m}</mark>`).slice(0,70);
    return `<div class="sri" onclick="viewMember('${l.member_name}');selectDate('${l.log_date}')">
      <div class="sri-date">${fmtShort(l.log_date)}</div>
      <div class="sri-member">${l.member_name}</div>
      <div class="sri-preview">${preview}</div>
    </div>`;
  }).join('');
}

function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  if(name==='write') document.getElementById('writePanel').classList.add('active');
  else if(name==='history'){ document.getElementById('historyPanel').classList.add('active'); renderHistory(); }
  else if(name==='request'){ document.getElementById('requestPanel').classList.add('active'); renderRequests(); }
}

function renderRequests(){
  console.log('renderRequests viewingMember:', viewingMember);
  const panel = document.getElementById('requestPanel');
  if(!panel) return;

  const isMe = viewingMember === currentMember;
  const filtered = allRequests
    .filter(r => r.to_member === viewingMember)
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  const addBtn = isMe ? '' : `
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="btn btn-save" onclick="addRequestModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        요청 추가
      </button>
    </div>`;

  if(!filtered.length){
    panel.innerHTML = addBtn + `<div class="empty-state"><div class="icon">✉️</div><div>요청사항이 없습니다.</div></div>`;
    return;
  }

  const cardsHtml = filtered.map(r => {
    const m = members.find(x => x.name === r.from_member);
    const fromColor = m ? m.color : '#888';
    const canComplete = r.to_member === currentMember && r.status === 'pending';
    const reqComments = allRequestComments
      .filter(c => c.request_id === r.id)
      .sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const commentsHtml = reqComments.map(c => {
      const isMyComment = c.member_name === currentMember;
      return `<div class="comment-item">
        <span class="comment-author" style="color:${memberColor(c.member_name)}">${escapeHtml(c.member_name)}</span>
        <span class="comment-text">${escapeHtml(c.content)}</span>
        <span class="comment-date">${fmtCommentDate(c.created_at)}</span>
        ${isMyComment?`<button style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:0.85em;padding:0 2px;" onclick="deleteRequestComment('${c.id}')">🗑️</button>`:''}
      </div>`;
    }).join('');
    return `
      <div class="req-card ${r.status}">
        <div class="req-meta">
          <span class="req-date">${r.log_date || (r.created_at||'').split('T')[0]}</span>
          <span class="req-from" style="background:${fromColor}">${r.from_member}</span>
          <span class="req-status ${r.status}">${r.status==='done'?'✅ 완료':'🕐 처리중'}</span>
        </div>
        <div class="req-title">${escapeHtml(r.title)}</div>
        ${r.content?`<div class="req-content">${escapeHtml(r.content).replace(/\n/g,'<br>')}</div>`:''}
        ${canComplete?`<div class="req-actions"><button class="btn btn-save btn-sm" onclick="completeRequest('${r.id}')">완료 처리</button></div>`:''}
        <div class="comment-section">
          <div style="font-size:0.82em;color:var(--muted);margin-bottom:8px;">💬 评论 ${reqComments.length}条</div>
          ${commentsHtml}
          <div class="comment-input-row">
            <input type="text" class="comment-input" id="rci-${r.id}"
              placeholder="댓글을 입력하세요..."
              onkeydown="if(event.key==='Enter')saveRequestComment('${r.id}','rci-${r.id}')">
            <button class="btn btn-save btn-sm" onclick="saveRequestComment('${r.id}','rci-${r.id}')">提交</button>
          </div>
        </div>
      </div>`;
  }).join('');

  panel.innerHTML = addBtn + cardsHtml;
}

async function saveRequest(toMember, fromMember, title, content){
  const req = {
    id: genUUID(), to_member: toMember, from_member: fromMember,
    title, content, status: 'pending',
    log_date: todayStr(), created_at: new Date().toISOString()
  };
  allRequests.unshift(req);
  if(demoMode){
    localStorage.setItem(REQ_KEY, JSON.stringify(allRequests)); return;
  }
  try {
    const r = await sbFetch('requests', {method:'POST', prefer:'return=minimal', body:JSON.stringify(req)});
    if(!r.ok) throw new Error();
  } catch(e){ /* 실패 시에도 in-memory 유지 */ }
  localStorage.setItem(SB_REQ_CACHE, JSON.stringify(allRequests));
}

async function completeRequest(id){
  const idx = allRequests.findIndex(r => r.id === id);
  if(idx >= 0) allRequests[idx].status = 'done';
  if(demoMode){
    localStorage.setItem(REQ_KEY, JSON.stringify(allRequests));
    renderRequests(); return;
  }
  try {
    const r = await sbFetch(`requests?id=eq.${id}`, {method:'PATCH', prefer:'return=minimal', body:JSON.stringify({status:'done'})});
    if(!r.ok) throw new Error();
  } catch(e){ /* 실패 시에도 in-memory 유지 */ }
  localStorage.setItem(SB_REQ_CACHE, JSON.stringify(allRequests));
  renderRequests();
}

async function saveRequestComment(requestId, inputId){
  const input = document.getElementById(inputId);
  if(!input) return;
  const content = input.value.trim();
  if(!content) return;
  const comment = {
    id: genUUID(), request_id: requestId,
    member_name: currentMember, content,
    created_at: new Date().toISOString()
  };
  allRequestComments.push(comment);
  input.value = '';
  if(demoMode){
    localStorage.setItem(RC_KEY, JSON.stringify(allRequestComments));
    renderRequests(); return;
  }
  try {
    const r = await sbFetch('request_comments', {method:'POST', prefer:'return=minimal', body:JSON.stringify(comment)});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
  } catch(e){ console.warn('[saveRequestComment] 실패:', e.message); }
  localStorage.setItem(RC_CACHE, JSON.stringify(allRequestComments));
  renderRequests();
}

async function deleteRequestComment(commentId){
  const comment = allRequestComments.find(c => c.id === commentId);
  if(!comment || comment.member_name !== currentMember){
    showToast('본인 댓글만 삭제 가능합니다','error'); return;
  }
  allRequestComments = allRequestComments.filter(c => c.id !== commentId);
  if(demoMode){
    localStorage.setItem(RC_KEY, JSON.stringify(allRequestComments));
    renderRequests(); return;
  }
  try {
    await sbFetch(`request_comments?id=eq.${commentId}`, {method:'DELETE'});
  } catch(e){ console.warn('[deleteRequestComment] 실패:', e.message); }
  localStorage.setItem(RC_CACHE, JSON.stringify(allRequestComments));
  renderRequests();
}

async function generateReport(){
  const log=getLog(currentMember,currentDate);
  const tasks=getTasksForLog(log);
  if(!tasks.length){ showToast('请先输入工作内容','error'); return; }
  showLoading('보고서 생성 중...');
  const report=buildReport(currentMember,currentDate,tasks);
  await saveLogData(currentMember,currentDate,{report});
  await loadAllLogs();
  hideLoading();
  showToast('📊 报告生成完成 — 请在顶部"报告管理"中查看','success');
}

function buildReport(member,date,tasks){
  const dateStr=fmtDate(date);
  const sections=tasks.map(t=>{
    const content=stripHtml(t.content||'');
    const lines=content.split('\n').map(l=>l.trim()?'  • '+l.trim():'').filter(Boolean).join('\n');
    return `【${t.title}】\n${lines||'  (내용 없음)'}`;
  });
  return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  일일 업무 보고서
  담당자: ${member}
  날  짜: ${dateStr}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

▶ 업무 내역 (총 ${tasks.length}건)

${sections.join('\n\n')}

─────────────────────────────
▶ 후속 조치 / 특이사항
  • 위 업무에 따른 후속 조치 예정

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
보고자: ${member}  |  ${dateStr}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
}

function setReportFilter(name){ reportFilterMember=name; currentReportId=null; renderReportScreen(); }

function selectReport(id){ currentReportId=id; editingReport=false; renderReportScreen(); renderReportDetail(id); }

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6m4-6v6"/></svg>删除

    ${imgs.length?`<div style="margin-bottom:14px;"><div style="font-size:0.78em;font-weight:700;color:var(--muted);margin-bottom:8px;">첨부 이미지</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${imgs.map(a=>`<img src="${a.data}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:2px solid var(--border);cursor:pointer;" onclick="window.open(this.src)">`).join('')}</div></div>`:''}
    ${files.length?`<div style="margin-bottom:14px;"><div style="font-size:0.78em;font-weight:700;color:var(--muted);margin-bottom:8px;">첨부 파일</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${files.map(a=>`<a href="${a.data}" download="${escapeHtml(a.name)}" class="attach-file" style="text-decoration:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>${escapeHtml(a.name)}</span></a>`).join('')}</div></div>`:''}

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>PDF保存

function startEditReport(id){
  const log=allLogs.find(l=>l.id===id);
  if(!log||log.member_name!==currentMember){ showToast('只能修改自己的报告','error'); return; }
  editingReport=true; renderReportDetail(id);
}

async function saveReportEdit(id){
  const text=quillReport?quillReport.getText().trim():'';
  showLoading('报告保存中...');
  const log=allLogs.find(l=>l.id===id);
  if(!log){ hideLoading(); return; }
  const ok=await saveLogData(log.member_name,log.log_date,{report:text});
  await loadAllLogs();
  editingReport=false; hideLoading();
  if(ok){ showToast('✅ 报告修改成功','success'); renderReportScreen(); }
}

function confirmDeleteReport(id){
  const log=allLogs.find(l=>l.id===id);
  if(!log||log.member_name!==currentMember){ showToast('只能删除自己的报告','error'); return; }
  showConfirm('确认删除',`${fmtShort(log.log_date)} 确定要删除此报告吗？`,async()=>{
    showLoading('删除中...');
    const ok=await deleteLog(id);
    await loadAllLogs();
    currentReportId=null; hideLoading();
    if(ok){ showToast('🗑️ 删除成功','success'); renderReportScreen(); }
  });
}

function exportSingleExcel(id){
  const log=allLogs.find(l=>l.id===id);
  if(!log) return;
  const tasks=getTasksForLog(log);
  const rows=[['담당자','날짜','업무 제목','업무 내용','보고서']];
  if(tasks.length){
    tasks.forEach(t=>rows.push([log.member_name,log.log_date,t.title,stripHtml(t.content),log.report||'']));
  } else {
    rows.push([log.member_name,log.log_date,'','',log.report||'']);
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:10},{wch:14},{wch:24},{wch:40},{wch:50}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'보고서');
  XLSX.writeFile(wb,`Report_${log.member_name}_${log.log_date}.xlsx`);
  showToast('📥 Excel导出完成','success');
}

function exportAllExcel(){
  const reports=allLogs.filter(l=>l.report&&(reportFilterMember==='ALL'||l.member_name===reportFilterMember));
  if(!reports.length){ showToast('没有可导出的报告','error'); return; }
  const rows=[['담당자','날짜','업무 제목','업무 내용','보고서']];
  reports.sort((a,b)=>a.log_date.localeCompare(b.log_date)).forEach(l=>{
    const tasks=getTasksForLog(l);
    if(tasks.length){
      tasks.forEach(t=>rows.push([l.member_name,l.log_date,t.title,stripHtml(t.content),l.report||'']));
    } else {
      rows.push([l.member_name,l.log_date,'','',l.report||'']);
    }
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:10},{wch:14},{wch:24},{wch:40},{wch:50}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'전체보고서');
  XLSX.writeFile(wb,`TeamReport_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('📥 全部导出完成','success');
}

marked.use({ mangle:false, headerIds:false });
function stripHtml(text){
  if(!text) return '';
  const d=document.createElement('div');
  d.innerHTML=text;
  return d.textContent||d.innerText||'';
}
